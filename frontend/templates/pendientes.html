<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FirmaDoc | Pendientes</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/firmadoc.css?v=12.1">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <div class="brand">FirmaDoc</div>
        <span class="brand-context">Bandeja de trabajo</span>
      </div>
      <div class="header-meta">
        <span class="status-pill lab-mode">MODO LABORATORIO</span>

        <button id="refreshButton" class="btn" type="button">Actualizar</button>
      </div>
    </header>

    <main class="list-workspace">
      <div class="list-heading">
        <div>
          <span class="section-kicker">FirmaDoc</span>
          <h1>Firmas pendientes</h1>
        </div>
        <p>Documentos que requieren una accion del usuario actual.</p>
      </div>
      <div id="alerts" aria-live="polite"></div>
      <section id="pendingList" class="pending-list" aria-label="Pendientes de firma"></section>
    </main>

    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/pendientes.js?v=12.1"></script>
  </body>
</html>
